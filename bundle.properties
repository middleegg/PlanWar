misc.button.knowledge = [yellow]Trivia Knowledge
knowledge.dialog.title = [yellow]I learned something!
knowledge.msg1 = Did you know, scrap shredder and sand sorter together can infinitely produce scrap and sand.
knowledge.msg2 = Did you know, Gauss machine gun, EM machine gun, light machine gun, heavy machine gun, dual-chain machine gun, rapid-fire cannon, and curvature overclock cannon are all considered machine guns.
knowledge.msg3 = Did you know, split bullets using Abyss Bone as ammo can hit the ground... though they won't do that.
knowledge.msg4 = Did you know, the Flame Cannon is the "special effects king", it fires few bullets and mostly special effects.
knowledge.msg5 = The plastic bullets of Canyang are intentional.
knowledge.msg6 = Let me think about the effects of each item/liquid as bullets... Copper and Lead have no special effects, Coal burns, Scrap no effect, Sand no effect, Surge alloy discharges electricity.
knowledge.msg7 = Let me think... Graphite increases damage but reduces fire rate, Titanium and Thorium increase damage, Silicon seeks targets, Spore pods none, Phase fabric none.
knowledge.msg8 = Let me think... Tempered glass and Plastanium split into small bullets, Sulfide causes higher damage burning, Explosive mixture causes area explosion.
knowledge.msg9 = Recommended screen zoom at 65% for mobile play.
advice.dialog.title = [green]Warnings
advice.pane.text = [green]This mod may cause possible adverse reactions:\nElves before eyes, golden hoop on head, yin flourishing and yang declining,\nhair loss, kidney and liver deficiency, brain fog,\nbody and soul flying apart, heart and ears cold, fingers weak,\nmorning without vigor, factory dreams, heart and brain weakness.\nIf any occurs, please go to the nearest clinic and purchase the following medicines:\nPangdahai x100, Menthol candy x100, any one of the above,\ntake with water and lie down in a cool, ventilated place and wait for death.
