misc.pane.text = The Poem of "Procrastination" by shallow_smiles:\nWorking hard on this mod, not for fame or gain.\nWe just want to keep delaying, with spirit and feeling.\nDay by day, feelings grow, but don't let delays break your heart.\nDelays all over the world, with delay in heart we can go on.\nDelay has its own reason, let me tell you in detail:\nThere are rules to delaying, and its own wonders.\nDon't stop when inspiration strikes! But be cautious when players urge!\nDon't lose the spirit of procrastination! Don't let players push you around!\nDon't always delay blindly! Don't delay aimlessly!\nEven hard times need delay! There's a house of delay within!\nWe can delay in groups! Let's delay together!\nBorn as a person who delays, destined to delay.\nHow can we go against delaying? Even the sky has delaying clouds.\nAbove us, there is the god of delay, below, there are people of delay.\nFriends delay with measure, don't lose heart from delaying.\nSo we delay and delay again, delay delay delay delay.
